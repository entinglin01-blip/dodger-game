<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>躲避遊戲 - Dodger Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-info">
            <div class="score">分數: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
            <div class="lives">生命: <span id="lives">3</span> ❤️</div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                <h1>遊戲結束！</h1>
                <p>最終分數: <span id="finalScore">0</span></p>
                <p>最高分: <span id="finalHighScore">0</span></p>
                <button onclick="restartGame()">重新開始</button>
            </div>
        </div>

        <div class="instructions">
            <h2>遊戲說明 📋</h2>
            <ul>
                <li>⬅️ ➡️ 移動角色</li>
                <li>⬆️ 跳躍 / 按空白鍵跳躍</li>
                <li>躲避紅色障礙物</li>
                <li>收集金色星星增加分數</li>
                <li>生命用完遊戲結束</li>
            </ul>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
